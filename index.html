<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon-app.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dutiva — AI-assisted, jurisdiction-aware HR compliance for Canadian employers. Bilingual EN/FR."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Dutiva — HR compliance for Canadian employers</title>
    <script>
      // Apply persisted theme + language before first paint to avoid a flash.
      ;(function () {
        try {
          var theme = localStorage.getItem('dutiva-theme')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          var lang = localStorage.getItem('dutiva-lang')
          if (lang !== 'en' && lang !== 'fr') lang = 'en'
          document.documentElement.setAttribute('lang', lang)
        } catch (e) {
          /* private mode — defaults stand */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
