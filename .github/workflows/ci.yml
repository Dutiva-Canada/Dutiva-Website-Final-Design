name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Production build: client + SSR bundles, prerendering of every public
      # page (EN + FR), and the dist-level SEO crawl validation
      # (scripts/validate-seo.mjs) — fails on any metadata/sitemap/link drift.
      - name: Build + SEO validation
        run: npm run build
