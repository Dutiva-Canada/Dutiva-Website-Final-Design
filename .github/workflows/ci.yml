name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Migration integrity, and drift between the repo and the live project.
      # Filename discipline always runs; the drift half compares every local
      # migration against supabase_migrations.schema_migrations and only runs
      # once SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF exist as repository
      # secrets — until then it skips rather than failing forks and PRs.
      #
      # This exists because three features shipped inert: a migration in the
      # repo but not on the project is invisible to every other check here.
      - name: Migration drift
        run: npm run check:migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Production build: client + SSR bundles, prerendering of every public
      # page (EN + FR), and the dist-level SEO crawl validation
      # (scripts/validate-seo.mjs) — fails on any metadata/sitemap/link drift.
      - name: Build + SEO validation
        run: npm run build
