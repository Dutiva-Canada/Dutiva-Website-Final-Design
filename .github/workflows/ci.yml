name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run on demand. The drift step below compares against the live project, so
  # it can go red without this repo changing at all — someone applying a
  # migration straight to the database is exactly the case it exists to catch.
  # Re-running it should not require inventing a commit.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # Migration integrity, and drift between the repo and the live project.
      # Filename discipline always runs; the drift half compares every local
      # migration against supabase_migrations.schema_migrations and only runs
      # once SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF exist as repository
      # secrets — until then it skips rather than failing forks and PRs.
      #
      # This exists because three features shipped inert: a migration in the
      # repo but not on the project is invisible to every other check here.
      #
      # Both secrets were set on 2026-08-06, so this is a real check now rather
      # than a skip. It runs in BOTH directions as of that date: a migration in
      # the repo but not applied, and — the half that was missing — one applied
      # to the project with no file committed. The second found eight, one of
      # them a security grant change and one a bug fix, all of which had existed
      # only in production. Fork PRs still skip, because GitHub withholds
      # secrets from them; that is correct, not a gap.
      - name: Migration drift
        run: npm run check:migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # Canonical-facts drift: the brand-palette rows of docs/CANONICAL_FACTS.md
      # compared against src/styles/. The rest of that file's code-backed rows
      # are covered by src/canonicalFacts.test.ts in the test step above; this
      # half is separate only because Vitest runs with `css: false` and cannot
      # read a stylesheet. A compliance product's source of record is worth
      # keeping true — the file exists because seven facts had already drifted.
      - name: Canonical facts
        run: npm run check:facts

      # Production build: client + SSR bundles, prerendering of every public
      # page (EN + FR), and the dist-level SEO crawl validation
      # (scripts/validate-seo.mjs) — fails on any metadata/sitemap/link drift.
      - name: Build + SEO validation
        run: npm run build
